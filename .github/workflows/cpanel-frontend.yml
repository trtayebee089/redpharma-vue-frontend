name: Build frontend for cPanel

on:
  push:
    branches: [cpanel-production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-frontend-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/cpanel-production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.js
      - run: npm run build
      - name: Publish static assets for cPanel
        run: bash scripts/publish-cpanel-release.sh
